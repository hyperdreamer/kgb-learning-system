<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">KGB 5-Box spaced repetition</title>
  <defs>
    <linearGradient id="background" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- A dark, rounded tile keeps the mark legible in light and dark chrome. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>

  <!-- Five review boxes: spaced repetition progress from first recall to mastery. -->
  <rect x="72" y="377" width="368" height="70" rx="22" fill="#07111F" fill-opacity="0.28"/>
  <rect x="101" y="394" width="48" height="36" rx="10" fill="#5EEAD4"/>
  <rect x="164" y="394" width="48" height="36" rx="10" fill="#38BDF8"/>
  <rect x="227" y="394" width="48" height="36" rx="10" fill="#60A5FA"/>
  <rect x="290" y="394" width="48" height="36" rx="10" fill="#818CF8"/>
  <rect x="353" y="394" width="48" height="36" rx="10" fill="#FBBF24"/>

  <!-- Offset card layers suggest a growing deck of study cards. -->
  <rect x="111" y="139" width="303" height="234" rx="32" fill="#CBD5E1"/>
  <rect x="78" y="106" width="303" height="234" rx="32" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Bookmark accent makes the mark read as a learning card at small sizes. -->
  <path d="M323 106H381V198L352 176L323 198V106Z" fill="#F59E0B"/>

  <!-- Minimal card content remains recognizable without relying on tiny text. -->
  <rect x="108" y="143" width="126" height="22" rx="11" fill="#0EA5E9"/>
  <rect x="108" y="192" width="198" height="16" rx="8" fill="#CBD5E1"/>
  <rect x="108" y="222" width="154" height="16" rx="8" fill="#CBD5E1"/>
  <rect x="108" y="252" width="181" height="16" rx="8" fill="#CBD5E1"/>
  <path d="M111 301L128 318L158 285" fill="none" stroke="#0F766E" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
</svg>
